<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A74DA"/>
      <stop offset="100%" stop-color="#4DA8F7"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect x="20" y="20" width="120" height="120" rx="12"/>
    </clipPath>
  </defs>

  <!-- Icon container -->
  <rect x="20" y="20" width="120" height="120" rx="12" fill="url(#skyGrad)"/>

  <!-- Mountains inside icon -->
  <g clip-path="url(#iconClip)">
    <!-- Back mountain range -->
    <polygon points="20,140 50,65 80,95 105,55 140,140" fill="url(#mountainGrad)" opacity="0.5"/>
    <!-- Front mountain range -->
    <polygon points="20,140 55,78 75,100 100,60 125,88 140,140" fill="#0D47A1" opacity="0.85"/>
    <!-- Snow caps -->
    <polygon points="100,60 108,72 92,72" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="55,78 61,87 49,87" fill="#FFFFFF" opacity="0.7"/>
    <!-- Sky accent - horizon glow -->
    <ellipse cx="80" cy="45" rx="50" ry="8" fill="#FFFFFF" opacity="0.12"/>
  </g>

  <!-- Company Name -->
  <text x="165" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#0D47A1" letter-spacing="-0.5">BIG SKY</text>
  <text x="165" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1976D2" letter-spacing="4">IT GROUP</text>

  <!-- Tagline -->
  <text x="165" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#78909C" letter-spacing="2.5">MONTANA MANAGED IT SOLUTIONS</text>
</svg>